name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Download Npcap SDK for linking
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://npcap.com/dist/npcap-sdk-1.15.zip' -OutFile "$env:RUNNER_TEMP\npcap-sdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\npcap-sdk.zip" "$env:RUNNER_TEMP\npcap-sdk"
          Copy-Item "$env:RUNNER_TEMP\npcap-sdk\Lib\x64\Packet.lib" Packet.lib
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test management CLI
        run: cargo test --locked --bin drcom4scut
      - name: Check code
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build and package Windows x64
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: drcom4scut-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: drcom4scut-linux-x64
          path: |
            target/release/drcom4scut
            target/release/drcom4scut-worker
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drcom4scut-windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          TAG="v$VERSION"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" --generate-notes --title "$TAG" -R "$GITHUB_REPOSITORY"
